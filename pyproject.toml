[tool.poetry]
name = "atomic-bayttle"
version = "0.1.0"
description = "A turn-based battle game built with Pygame."
authors = ["Paul Mairesse, Axel Loones, Louis Le Meilleur, Joseph Bénard, and Théo de Aranjo"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
pydub = "0.25.1"
pygame = "2.6.1"
pygame-easy-menu = {version = "0.0.63", extras = ["opengl"]}
moderngl = "5.12.0"
pypresence = "4.2.1"

[tool.poetry.group.build.dependencies]
pyinstaller = "^6.0"

[tool.poetry.group.test.dependencies]
pytest = "^8.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
