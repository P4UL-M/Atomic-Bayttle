name: renderer

on:
  push:
  pull_request:

jobs:
  test-and-package:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install poetry
      - run: poetry install
      - if: runner.os == 'Linux'
        run: xvfb-run -a poetry run pytest -q
      - if: runner.os != 'Linux'
        run: poetry run pytest -q
      - run: poetry run pyinstaller --clean --noconfirm Atomic-Bayttle.spec
      - if: runner.os != 'Windows'
        run: dist/Atomic-Bayttle/Atomic-Bayttle --renderer-smoke
      - if: runner.os == 'Windows'
        run: dist/Atomic-Bayttle/Atomic-Bayttle.exe --renderer-smoke
